name: Android release build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)"[[:space:]]*$/\1/p' app/build.gradle.kts | head -n 1)"
          if [ -z "$VERSION" ]; then
            echo "Unable to determine versionName from app/build.gradle.kts" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building Pocket Watchtower v$VERSION"

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify APK exists
        shell: bash
        run: |
          test -f "app/build/outputs/apk/release/app-release.apk"
          echo "APK built successfully for v${{ steps.version.outputs.version }}"

      - name: Give release APK a clean filename
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
            "app/build/outputs/apk/release/Pocket-Watchtower-v${{ steps.version.outputs.version }}.apk"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: pocket-watchtower-v${{ steps.version.outputs.version }}-release
          path: app/build/outputs/apk/release/Pocket-Watchtower-v${{ steps.version.outputs.version }}.apk
          if-no-files-found: error
          retention-days: 90
