name: Android build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Give release APK a clean filename
        run: cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Pocket-Watchtower-v0.4.0.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: pocket-watchtower-v0.4.0-release
          path: app/build/outputs/apk/release/Pocket-Watchtower-v0.4.0.apk
          if-no-files-found: error
