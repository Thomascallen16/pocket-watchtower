name: Android validation

on:
  pull_request:
    branches: [ main ]

concurrency:
  group: pocket-watchtower-android-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Validate release version
        shell: bash
        run: |
          VERSION="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=\s*"\([^"]*\)"[[:space:]]*$/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$VERSION"
          echo "Validating Pocket Watchtower v$VERSION"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify debug APK exists
        run: test -f app/build/outputs/apk/debug/app-debug.apk
